<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#0a0308">
<title>بحبك 💗</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cairo:wght@300;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden;background:#06020a}
body{
  font-family:'Cairo',sans-serif;color:#fff;position:relative;
  -webkit-tap-highlight-color:transparent;user-select:none;touch-action:manipulation;
}

.bg{
  position:fixed;inset:0;z-index:-6;
  background:radial-gradient(circle at 50% 40%,#3a1024 0%,#1a0812 45%,#06020a 100%);
}
.aurora{position:fixed;inset:0;z-index:-5;overflow:hidden;pointer-events:none}
.aurora span{
  position:absolute;border-radius:50%;filter:blur(90px);opacity:.5;
  animation:auroraFloat 18s ease-in-out infinite alternate;
}
.aurora span:nth-child(1){
  width:60vmax;height:60vmax;top:-22vmax;right:-18vmax;
  background:radial-gradient(circle,rgba(255,45,110,.55),transparent 65%);
}
.aurora span:nth-child(2){
  width:55vmax;height:55vmax;bottom:-20vmax;left:-15vmax;
  background:radial-gradient(circle,rgba(150,40,255,.5),transparent 65%);
  animation-duration:22s;animation-direction:alternate-reverse;
}
.aurora span:nth-child(3){
  width:45vmax;height:45vmax;top:35%;left:55%;
  background:radial-gradient(circle,rgba(255,120,180,.35),transparent 65%);
  animation-duration:26s;
}
@keyframes auroraFloat{
  0%{transform:translate3d(0,0,0) scale(1)}
  100%{transform:translate3d(-6vmax,6vmax,0) scale(1.2)}
}

/* ============ نجوم ============ */
.stars{position:fixed;inset:0;z-index:-4;pointer-events:none;overflow:hidden}
.star{
  position:absolute;border-radius:50%;background:#fff;
  box-shadow:0 0 6px #fff,0 0 12px rgba(255,180,210,.9),0 0 20px rgba(255,120,170,.5);
  animation:twinkleStar 3s ease-in-out infinite;
}
@keyframes twinkleStar{
  0%,100%{opacity:.2;transform:scale(.6)}
  50%{opacity:1;transform:scale(1.4)}
}

/* ============ شهب واضحة ============ */
.shooting-star{
  position:fixed;
  width:260px;
  height:5px;
  border-radius:5px;
  background:linear-gradient(90deg,
    transparent 0%,
    rgba(255,255,255,.15) 20%,
    #fff 55%,
    #ffe0ec 75%,
    #ff9fc6 90%,
    transparent 100%);
  filter:
    drop-shadow(0 0 8px #ffffff)
    drop-shadow(0 0 18px #ff9fc6)
    drop-shadow(0 0 32px #ff4f8b);
  transform-origin:left center;
  pointer-events:none;
  z-index:-2;
  opacity:0;
  animation:shoot 2s ease-out forwards;
}

/* نقطة اللمعان في رأس الشهاب */
.shooting-star::after{
  content:"";
  position:absolute;
  right:0;top:50%;
  width:10px;height:10px;
  margin-top:-5px;
  border-radius:50%;
  background:#fff;
  box-shadow:
    0 0 12px #fff,
    0 0 24px #ff9fc6,
    0 0 40px #ff4f8b;
}

@keyframes shoot{
  0%{
    opacity:0;
    transform:translate3d(0,0,0) rotate(35deg) scaleX(0);
  }
  12%{
    opacity:1;
    transform:translate3d(0,0,0) rotate(35deg) scaleX(.4);
  }
  20%{
    opacity:1;
    transform:translate3d(calc(var(--dx)*.2),calc(var(--dy)*.2),0) rotate(35deg) scaleX(1);
  }
  85%{
    opacity:1;
  }
  100%{
    opacity:0;
    transform:translate3d(var(--dx),var(--dy),0) rotate(35deg) scaleX(1);
  }
}

/* ============ المسرح ============ */
.stage{
  position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:1;
}
.halo{
  position:absolute;width:min(100vw,820px);aspect-ratio:1;border-radius:50%;
  background:radial-gradient(circle,rgba(255,60,120,.35) 0%,rgba(255,60,120,.10) 42%,transparent 72%);
  filter:blur(45px);pointer-events:none;
  animation:haloPulse 1.6s ease-in-out infinite;
}
@keyframes haloPulse{
  0%{transform:scale(.9);opacity:.5}
  13%{transform:scale(1.1);opacity:.9}
  26%{transform:scale(.92);opacity:.5}
  39%{transform:scale(1.06);opacity:.8}
  56%{transform:scale(.9);opacity:.5}
  100%{transform:scale(.9);opacity:.5}
}

.pulse-wrap{
  position:absolute;left:50%;top:50%;width:0;height:0;
  animation:heartbeat 1.6s ease-in-out infinite;
  will-change:transform;
}
@keyframes heartbeat{
  0%{transform:scale(1)}
  13%{transform:scale(1.08)}
  26%{transform:scale(1)}
  39%{transform:scale(1.05)}
  56%{transform:scale(1)}
  100%{transform:scale(1)}
}

.hh{
  position:absolute;left:0;top:0;
  transform:translate(-50%,-50%);
  pointer-events:none;
  filter:drop-shadow(0 0 4px rgba(255,80,140,.6));
  animation:hhBeat 1.6s ease-in-out infinite;
}
@keyframes hhBeat{
  0%{transform:translate(-50%,-50%) scale(1)}
  13%{transform:translate(-50%,-50%) scale(1.12)}
  26%{transform:translate(-50%,-50%) scale(1)}
  39%{transform:translate(-50%,-50%) scale(1.06)}
  56%{transform:translate(-50%,-50%) scale(1)}
  100%{transform:translate(-50%,-50%) scale(1)}
}

.love{
  position:absolute;left:0;top:0;
  transform:translate(-50%,-50%);
  font-family:'Amiri',serif;
  font-weight:700;
  font-size:clamp(3rem,12vw,7.5rem);
  line-height:1;
  padding:0 .1em;
  background:linear-gradient(180deg,#ffffff 0%,#fff0f5 45%,#ffd6e6 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:
    drop-shadow(0 2px 8px rgba(0,0,0,.35))
    drop-shadow(0 0 14px rgba(255,150,190,.55))
    drop-shadow(0 0 30px rgba(255,100,160,.35));
  white-space:nowrap;
  z-index:5;
  letter-spacing:.01em;
}

.ambient{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.ambient .h{
  position:absolute;bottom:-60px;width:var(--s);height:var(--s);opacity:0;
  animation:floatUp var(--dur) linear forwards;
  filter:drop-shadow(0 0 8px rgba(255,80,140,.65));
}
@keyframes floatUp{
  0%{transform:translateY(0) translateX(0) rotate(0);opacity:0}
  10%{opacity:var(--o)}
  90%{opacity:var(--o)}
  100%{transform:translateY(-115vh) translateX(var(--tx)) rotate(360deg);opacity:0}
}

/* ============ النقر: قلوب بس من غير دايرة ============ */
.click-layer{position:fixed;inset:0;pointer-events:none;z-index:4;overflow:hidden}
.click-heart{
  position:absolute;pointer-events:none;
  animation:pop 1.9s cubic-bezier(.22,.61,.36,1) forwards;
  will-change:transform,opacity;
}
@keyframes pop{
  0%{transform:translate3d(0,0,0) scale(0) rotate(var(--rot));opacity:0}
  15%{transform:translate3d(calc(var(--dx)*.15),-14px,0) scale(1.3) rotate(var(--rot));opacity:1}
  32%{transform:translate3d(calc(var(--dx)*.35),-36px,0) scale(1) rotate(var(--rot));opacity:1}
  100%{transform:translate3d(var(--dx),-260px,0) scale(.4) rotate(var(--rot));opacity:0}
}

.vignette{
  position:fixed;inset:0;z-index:5;pointer-events:none;
  box-shadow:inset 0 0 25vmax rgba(0,0,0,.9);
}
.flash{
  position:fixed;inset:0;z-index:20;background:#fff;pointer-events:none;
  animation:flashOut 1.2s ease-out forwards;opacity:0;
}
@keyframes flashOut{0%{opacity:0}8%{opacity:.35}100%{opacity:0}}
</style>
</head>
<body>

<div class="bg"></div>
<div class="aurora"><span></span><span></span><span></span></div>
<div class="stars" id="stars"></div>
<div class="ambient" id="ambient"></div>

<main class="stage">
  <div class="halo"></div>
  <div class="pulse-wrap" id="pulseWrap">
    <h1 class="love">بحبك</h1>
  </div>
</main>

<div class="click-layer" id="clickLayer"></div>
<div class="vignette"></div>
<div class="flash"></div>

<script>
(function(){
  "use strict";

  const HEART_PATH = "M12 21.3l-1.4-1.3C5.4 15.4 2 12.3 2 8.5 2 5.4 4.4 3 7.5 3c1.7 0 3.4.8 4.5 2.1C13.1 3.8 14.8 3 16.5 3 19.6 3 22 5.4 22 8.5c0 3.8-3.4 6.9-8.6 11.5L12 21.3z";

  const INNER = [['#ffffff','#ffd0e2'],['#fff0f5','#ffb8d4']];
  const MID   = [['#ffe8f0','#ff6ba6'],['#ffdce9','#ff4f8b'],['#ffcce0','#ff3d7f']];
  const OUTER = [['#ffd6e6','#ff2e6e'],['#ffc0d6','#ff1f63'],['#ffaacb','#e6005c']];
  const AMBIENT_PAL = [
    ['#ffe0ec','#ff3d7f'],['#fff0f6','#ff6ba6'],['#ffc9de','#ff1f63'],
    ['#ffb8d3','#e6005c'],['#ffe6f0','#ff85b3'],['#ffd6e6','#ff4f8b']
  ];
  const pick = a => a[(Math.random()*a.length)|0];
  let uid = 0;

  function heartSVG(colors){
    const id = 'hg'+(uid++);
    return '<svg viewBox="0 0 24 24" width="100%" height="100%">'+
      '<defs>'+
        '<linearGradient id="'+id+'" x1="0" y1="0" x2="0" y2="1">'+
          '<stop offset="0" stop-color="'+colors[0]+'"/>'+
          '<stop offset="1" stop-color="'+colors[1]+'"/>'+
        '</linearGradient>'+
        '<radialGradient id="'+id+'h" cx="32%" cy="28%" r="42%">'+
          '<stop offset="0" stop-color="#fff" stop-opacity=".85"/>'+
          '<stop offset="1" stop-color="#fff" stop-opacity="0"/>'+
        '</radialGradient>'+
      '</defs>'+
      '<path d="'+HEART_PATH+'" fill="url(#'+id+')"/>'+
      '<ellipse cx="8.5" cy="8" rx="2.4" ry="1.5" fill="url(#'+id+'h)" transform="rotate(-28 8.5 8)"/>'+
      '</svg>';
  }

  /* ============ 1) نجوم ============ */
  const starsBox = document.getElementById('stars');
  for (let i = 0; i < 80; i++){
    const s = document.createElement('div');
    s.className = 'star';
    s.style.left = (Math.random()*100) + 'vw';
    s.style.top  = (Math.random()*100) + 'vh';
    const size = 1 + Math.random()*2.4;
    s.style.width  = size + 'px';
    s.style.height = size + 'px';
    if (Math.random() > 0.6){
      s.style.background = '#ffd0e0';
      s.style.boxShadow = '0 0 8px #ffd0e0,0 0 16px rgba(255,140,180,.9)';
    }
    s.style.animationDuration = (1.8 + Math.random()*3) + 's';
    s.style.animationDelay = (-Math.random()*4) + 's';
    starsBox.appendChild(s);
  }

  /* ============ 2) شهب واضحة وكثيرة ============ */
  function shootStar(){
    const el = document.createElement('div');
    el.className = 'shooting-star';

    // بتطلع من فوق على اليسار غالباً
    const startX = Math.random() * (window.innerWidth * 0.6);
    const startY = Math.random() * (window.innerHeight * 0.35);

    el.style.left = startX + 'px';
    el.style.top  = startY + 'px';

    // بتتحرك قطرياً لأسفل اليمين
    const dist = 220 + Math.random() * 260;
    el.style.setProperty('--dx', dist + 'px');
    el.style.setProperty('--dy', (dist * 1.15) + 'px');

    // مدة مختلفة لكل شهاب
    el.style.animationDuration = (1.6 + Math.random() * 1.2).toFixed(2) + 's';

    document.body.appendChild(el);
    setTimeout(()=>el.remove(), 3000);
  }

  // شهاب كل 800ms
  setInterval(shootStar, 800);
  // انطلاقة ترحيبية
  setTimeout(shootStar, 300);
  setTimeout(shootStar, 700);
  setTimeout(shootStar, 1100);

  /* ============ 3) شكل القلب من القلوب ============ */
  const wrap = document.getElementById('pulseWrap');
  const minDim = Math.min(window.innerWidth, window.innerHeight);
  const unit = minDim / 28;

  function heartXY(t){
    const x = 16 * Math.pow(Math.sin(t), 3);
    const y = 13*Math.cos(t) - 5*Math.cos(2*t) - 2*Math.cos(3*t) - Math.cos(4*t);
    return [x, y];
  }

  const LAYERS = 12;
  for (let L = 0; L < LAYERS; L++){
    const ls = 0.42 + (L / (LAYERS - 1)) * 0.58;
    const count = Math.max(8, Math.round(ls * 46));
    const phase = Math.random() * Math.PI * 2;

    let colors;
    if (ls < 0.62) colors = pick(INNER);
    else if (ls < 0.82) colors = pick(MID);
    else colors = pick(OUTER);

    for (let i = 0; i < count; i++){
      const t = (i / count) * Math.PI * 2 + phase;
      const [hx, hy] = heartXY(t);

      const px = hx * ls * unit;
      const py = -(hy + 3) * ls * unit;

      const el = document.createElement('div');
      el.className = 'hh';
      el.style.left = px.toFixed(2) + 'px';
      el.style.top  = py.toFixed(2) + 'px';

      const size = (5.5 + ls * 5 + Math.random() * 2).toFixed(1);
      el.style.width  = size + 'px';
      el.style.height = size + 'px';
      el.style.animationDelay = (-Math.random() * 0.5) + 's';

      el.innerHTML = heartSVG(colors);
      wrap.appendChild(el);
    }
  }

  /* ============ 4) قلوب طايرة ============ */
  const ambient = document.getElementById('ambient');
  function spawnAmbient(){
    const el = document.createElement('div');
    el.className = 'h';
    const s = 12 + Math.random()*24;
    el.style.left = (Math.random()*100) + 'vw';
    el.style.setProperty('--s', s + 'px');
    el.style.setProperty('--o', (0.3 + Math.random()*0.5).toFixed(2));
    el.style.setProperty('--dur', (7 + Math.random()*7).toFixed(1) + 's');
    el.style.setProperty('--tx', (Math.random()*120 - 60) + 'px');
    el.innerHTML = heartSVG(pick(AMBIENT_PAL));
    ambient.appendChild(el);
    setTimeout(()=>el.remove(), 15000);
  }
  for (let i = 0; i < 10; i++) setTimeout(spawnAmbient, i*600);
  setInterval(spawnAmbient, 1200);

  /* ============ 5) النقر: قلوب بس ============ */
  const clickLayer = document.getElementById('clickLayer');

  function spawnHeart(x, y, scale){
    scale = scale || 1;
    const size = (18 + Math.random()*34) * scale;
    const w = document.createElement('div');
    w.className = 'click-heart';
    w.style.left = x+'px'; w.style.top = y+'px';
    w.style.width  = size+'px';
    w.style.height = size+'px';
    w.style.marginLeft = (-size/2)+'px';
    w.style.marginTop  = (-size/2)+'px';
    w.style.setProperty('--rot', (Math.random()*70 - 35).toFixed(1) + 'deg');
    w.style.setProperty('--dx',  (Math.random()*180 - 90).toFixed(1) + 'px');
    w.innerHTML = heartSVG(pick(AMBIENT_PAL));
    clickLayer.appendChild(w);
    setTimeout(()=>w.remove(), 2000);
  }

  function burst(x, y){
    spawnHeart(x, y, 1.2);
    for (let i = 0; i < 4; i++){
      setTimeout(()=>{
        const a = Math.random()*Math.PI*2;
        const d = 20 + Math.random()*50;
        spawnHeart(x + Math.cos(a)*d, y + Math.sin(a)*d, 0.85);
      }, 60 + i*70);
    }
  }

  window.addEventListener('pointerdown', e => {
    burst(e.clientX, e.clientY);
  }, { passive: true });

  let lastT = 0;
  window.addEventListener('pointermove', e => {
    if (e.pointerType === 'mouse' && e.buttons === 0) return;
    const now = Date.now();
    if (now - lastT < 80) return;
    lastT = now;
    spawnHeart(e.clientX, e.clientY, 0.7);
  }, { passive: true });

  /* ============ 6) انفجار ترحيبي ============ */
  window.addEventListener('load', () => {
    const cx = innerWidth/2, cy = innerHeight/2;
    for (let i = 0; i < 14; i++){
      setTimeout(()=>{
        const a = Math.random()*Math.PI*2;
        const r = 80 + Math.random()*Math.min(innerWidth, innerHeight)*0.33;
        spawnHeart(cx + Math.cos(a)*r, cy + Math.sin(a)*r*0.75, 1);
      }, i*80);
    }
  });

})();
</script>
</body>
</html>
